<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>材料承认助手</title>
<meta name="description" content="材料承认流程的状态登记工具：哪个批次走到哪、下一步做什么、今天该去哪个场地。">
<meta name="theme-color" content="#2563a8">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{
  /* B站粉蓝 · 浅色马卡龙 */
  --bg:#f7f8fa;
  --card:#ffffff;
  --ink:#18191c;
  --muted:#8a8f99;
  --line:#eef0f3;

  --blue:#57aee0;
  --blue-soft:#e9f5fd;
  --pink:#f58bae;
  --pink-soft:#fff0f5;

  --ok:#4cc79a;
  --ok-soft:#e8f9f2;
  --warn:#e8b45c;
  --warn-soft:#fff6e8;
  --bad:#f2737a;
  --bad-soft:#ffeef0;

  --brand:var(--blue);
  --brand-soft:var(--blue-soft);
  --shadow:0 2px 14px rgba(120,140,170,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:15px/1.55 "Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  background:
    radial-gradient(900px 340px at 6% -12%, #ffe6ef 0%, transparent 62%),
    radial-gradient(900px 340px at 96% -16%, #e2f3fe 0%, transparent 62%),
    radial-gradient(600px 240px at 50% -6%, #fff6e6 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:760px;margin:0 auto;padding:0 14px 60px}

header.top{
  position:sticky; top:0; z-index:10; background:transparent;
  display:flex; align-items:center; gap:10px; padding:14px 0 10px;
}
header.top h1{font-size:17px;margin:0;font-weight:600;flex:1}
.back{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:10px; padding:6px 12px; font-size:14px; cursor:pointer;
  box-shadow:var(--shadow);
}
.back:hover{border-color:#e0e4e9}

.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  border-radius:999px; padding:7px 16px; font-size:14px; cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.tab:hover{color:var(--pink)}
.tab.on{
  background:var(--pink); border-color:var(--pink); color:#fff;
  box-shadow:0 4px 12px rgba(251,114,153,.28);
}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.blue b{color:var(--blue)}
.stat.pink b{color:var(--pink)}
.stat.alert b{color:var(--bad)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.code{font-weight:600;font-size:16px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.next{color:var(--blue);font-size:13px;margin-top:6px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.pink{background:var(--pink-soft);color:var(--pink)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.n{background:#f1f2f4;color:var(--muted)}
.lnk{color:var(--blue);cursor:pointer}
.lnk:hover{text-decoration:underline}
[data-act]{cursor:pointer}
[data-act]:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:10px}

.bar{height:6px;background:#f1f2f4;border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--pink))}
.bar.done i{background:var(--ok)}

.item{
  display:flex;align-items:center;gap:10px;padding:12px 10px;
  border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;
}
.item:last-child{border-bottom:0}
.item:hover{background:#fafbfc}
.dot{
  width:12px;height:12px;border-radius:50%;flex:none;box-sizing:border-box;
  border:2px solid #d9dee5;background:#fff;
}
.dot.doing{background:var(--blue);border-color:var(--blue)}
.dot.pending{background:var(--warn);border-color:var(--warn)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.fail{background:var(--bad);border-color:var(--bad)}
.dot.skip{background:#e7e9ec;border-color:#e7e9ec}
.item.todo .nm{color:var(--ink)}
.item.done .nm{color:var(--muted);text-decoration:line-through}
.item.fail .nm{color:var(--bad)}
.item .nm{flex:1}
.item .meta{font-size:12px;color:var(--muted)}

.btn{
  display:block;width:100%;border:0;border-radius:12px;padding:16px;
  font-size:16px;font-family:inherit;cursor:pointer;margin-bottom:10px;font-weight:500;
  transition:transform .1s;
}
.btn:active{transform:scale(.985)}
.btn.start{background:var(--blue-soft);color:var(--blue)}
.btn.finish{background:var(--ok);color:#fff}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.fail{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--muted)}
.btn.primary{background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(251,114,153,.28)}
.btn:disabled{opacity:.4;cursor:default}

input,select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;background:var(--card);color:var(--ink);margin-bottom:10px;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(251,114,153,.12)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}

.note{font-size:13px;color:var(--muted);line-height:1.6}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.banner{
  background:var(--bad-soft);border:1px solid #ffd9d9;color:#b03030;
  border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.6;
}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#fafbfc;font-weight:600;color:var(--muted);position:sticky;top:52px}
td.c{text-align:center}
.mark{background:var(--blue-soft);color:var(--blue);font-weight:600;border-radius:6px}
.scroll{overflow-x:auto}
footer{margin-top:24px;text-align:center}
footer button{
  background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;
  text-decoration:underline;font-family:inherit;
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ------------------------------------------------------------------ 数据 */
const ITEMS = [
  {id:'D', name:'尺寸测量①长宽高',   group:'尺寸',       sites:['2号楼3楼','1号楼5楼']},
  {id:'E', name:'尺寸测量②内径投影', group:'尺寸',       sites:['1号楼5楼','2号楼4楼']},
  {id:'F', name:'米电阻测试',         group:'电学性能',   sites:['1号楼4楼']},
  {id:'G', name:'IT熔断测试',         group:'电学性能',   sites:['办公楼2楼']},
  {id:'H', name:'硬度测试',           group:'力学性能',   sites:['2号楼2楼']},
  {id:'I', name:'拉力测试',           group:'力学性能',   sites:['2号楼3楼']},
  {id:'J', name:'镀层-退镀法',        group:'镀层检测',   sites:['2号楼3楼']},
  {id:'K', name:'镀层-镀层仪',        group:'镀层检测',   sites:['2号楼3楼','办公楼2楼']},
  {id:'L', name:'可焊性',             group:'可靠性验证', sites:['2号楼3楼']},
  {id:'M', name:'助焊剂',             group:'可靠性验证', sites:['2号楼3楼']},
  {id:'N', name:'分断测试',           group:'可靠性验证', sites:['2号楼1楼','办公楼1楼']},
  {id:'O', name:'透液性',             group:'可靠性验证', sites:['2号楼3楼']},
  {id:'P', name:'装配实验',           group:'可靠性验证', sites:['样品室']},
  {id:'Q', name:'密度测试',           group:'其他',       sites:['2号楼3楼']},
  {id:'R', name:'x射线',              group:'其他',       sites:['1号楼1楼']},
  {id:'S', name:'黏度',               group:'其他',       sites:['1号楼5楼']}
];

const CATS = [
  {id:1, name:'可熔体（丝材）', variant:'', items:['D','F','G']},
  {id:2, name:'可熔体（银铜带）', variant:'纯银带', items:['D','F','H']},
  {id:3, name:'可熔体（银铜带）', variant:'铜带', items:['D','F','H']},
  {id:4, name:'可熔体（银铜带）', variant:'镀银铜带', items:['D','H','K']},
  {id:5, name:'可熔体（银铜带）', variant:'银铜复合带', items:['D','H','I']},
  {id:6, name:'陶瓷管', variant:'', items:['D','E','I','N','O','P','Q','R']},
  {id:7, name:'引线铜帽（电镀线）', variant:'', items:['D','E','I','J','K','L','P']},
  {id:8, name:'引线铜帽（电镀线）', variant:'铜帽', items:['D','E','J','K','P']},
  {id:9, name:'包装材料', variant:'', items:['D','P']},
  {id:10, name:'焊锡', variant:'', items:['D','L','M']},
  {id:11, name:'塑料件', variant:'', items:['D','I','L','P']},
  {id:12, name:'陶瓷基板', variant:'', items:['D','E','O','R']},
  {id:13, name:'陶瓷基板', variant:'镀金镀镍基板', items:['D','K']},
  {id:14, name:'浆料', variant:'', items:['S']}
];

const STATUS_TEXT = {todo:'未开始', doing:'进行中', pending:'待判定',
                     done:'合格', fail:'不合格', skip:'免做'};
const STATUS_DOT  = {todo:'⬜', doing:'🟡', pending:'🟨', done:'✅', fail:'🔴', skip:'➖'};
const STALE_DAYS = 2;

const KEY = 'mat-recog-proto-v1';

function today(){ return new Date().toISOString().slice(0,10); }
function daysAgo(d){ return (Date.now() - new Date(d).getTime()) / 86400000; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 全新打开就是一张白纸，不带任何示例数据
function seed(){
  return { seq:1, view:'board', batches:[], trash:[], ioResult:null };
}
function emptyState(){
  return { seq:1, view:'board', batches:[], trash:[], ioResult:null };
}

let S = load();

function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ return seed(); }
  if(!raw) return seed();
  try {
    return normalize(JSON.parse(raw));
  } catch(e) {
    // 数据解析失败时绝不静默清空——把原始内容留着，让用户能导出留底
    const s = emptyState();
    s.loadError = true;
    s.loadErrorRaw = raw;
    return s;
  }
}
// 老版本存下来的数据没有 round / history / buyer 这些字段，读进来时补齐，别让旧数据把页面搞崩
function normalize(p){
  // 格式不对就抛错，交给 load() 走"救急"分支，绝不静默清空
  if(!p || typeof p !== 'object' || !Array.isArray(p.batches)) {
    throw new Error('本地数据的格式不对');
  }
  p.view = 'board';
  p.ioResult = null;
  p.batches = p.batches.filter(b => b && b.code && Array.isArray(b.items));
  p.trash = Array.isArray(p.trash) ? p.trash.filter(b => b && b.code && Array.isArray(b.items)) : [];
  const maxId = p.batches.reduce((m, b) => Math.max(m, Number(b.id) || 0), 0);
  const maxTrash = p.trash.reduce((m, b) => Math.max(m, Number(b.id) || 0), 0);
  p.seq = Math.max(Number(p.seq) || 0, maxId + 1, maxTrash + 1);
  [...p.batches, ...p.trash].forEach(b => {
    b.round      = Math.max(1, Number(b.round) || 1);
    b.history    = Array.isArray(b.history) ? b.history : [];
    b.buyer      = b.buyer || '';
    b.conclusion = (b.conclusion === '承认' || b.conclusion === '不承认') ? b.conclusion : '';
    b.archiveAt  = b.archiveAt || '';
    b.lastUpdate = b.lastUpdate || b.recvDate || today();
    b.items = b.items.map(i => ({
      id: i.id,
      status: STATUS_TEXT[i.status] ? i.status : 'todo',
      value: i.value || '',
      note: i.note || '',
      startDate: i.startDate || null,
      doneDate: i.doneDate || null
    }));
  });
  return p;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ------------------------------------------------------------- 计算规则 */
function cat(b){ return CATS.find(c => c.id === b.catId); }
function catName(b){ const c = cat(b); return c.name + (c.variant ? ' · ' + c.variant : ''); }
function itemName(id){ const t = ITEMS.find(x => x.id === id); return t ? t.name : id; }
function itemGroup(id){ const t = ITEMS.find(x => x.id === id); return t ? t.group : ''; }
function itemSites(id){ const t = ITEMS.find(x => x.id === id); return (t && t.sites) ? t.sites : []; }
function itemSiteText(id){ const s = itemSites(id); return s.length ? s[0] : '未填场地'; }

const SETTLED = ['done','fail','skip'];          // 已有结论
const WORKED  = ['done','fail','pending','skip']; // 活已干完（含待判）

function judgedCount(b){ return b.items.filter(i => SETTLED.includes(i.status)).length; }
function workedCount(b){ return b.items.filter(i => WORKED.includes(i.status)).length; }
function pendingCount(b){ return b.items.filter(i => i.status === 'pending').length; }
function needsJudge(b){ return pendingCount(b) > 0; }
function workDone(b){ return b.items.every(i => WORKED.includes(i.status)); }
function allDone(b){ return b.items.every(i => SETTLED.includes(i.status)); }
function hasFail(b){ return b.items.some(i => i.status === 'fail'); }
function nextItem(b){ return b.items.find(i => i.status==='todo' || i.status==='doing'); }

function isStale(b){
  return !allDone(b) && !b.conclusion && daysAgo(b.lastUpdate) > STALE_DAYS;
}
// 漏项：前面的没做完，后面的却已经做完
function hasGap(b){
  let seenOpen = false;
  for(const it of b.items){
    if(it.status==='todo' || it.status==='doing') seenOpen = true;
    else if(seenOpen && WORKED.includes(it.status)) return true;
  }
  return false;
}
function exceptionTag(b){
  if(hasGap(b)) return {cls:'bad', text:'⚠ 漏项'};
  if(isStale(b)) return {cls:'warn', text:'停滞 '+Math.floor(daysAgo(b.lastUpdate))+'天'};
  return null;
}

function tagsHTML(b){
  const out = [];
  const exc = exceptionTag(b);
  if(exc) out.push(`<span class="tag ${exc.cls}">${exc.text}</span>`);
  const np = pendingCount(b);
  if(np && !b.conclusion) out.push(`<span class="tag warn">${np} 项待判</span>`);
  if(b.conclusion) out.push(`<span class="tag ${b.conclusion==='承认'?'ok':'bad'}">${b.conclusion}</span>`);
  else if(allDone(b)) out.push(`<span class="tag warn">待承认</span>`);
  return out.join(' ');
}

function touch(b){ b.lastUpdate = today(); }

/* ------------------------------------------------------------------ 渲染 */
const app = document.getElementById('app');

function render(){
  save();
  const v = S.view;
  if(v === 'board')       return viewBoard();
  if(v === 'detail')      return viewDetail(S.cur);
  if(v === 'record')      return viewRecord(S.cur, S.curItem);
  if(v === 'new')         return viewForm('new');
  if(v === 'edit')        return viewForm('edit');
  if(v === 'site')        return viewSite();
  if(v === 'config')      return viewConfig();
  if(v === 'io')          return viewIO();
}

function header(title, backTo){
  return `<header class="top">
    ${backTo ? `<button class="back" data-act="go" data-to="${backTo}">← 返回</button>` : ''}
    <h1>${title}</h1>
  </header>${S.loadError ? `
    <div class="banner">
      <b>本地数据读不出来。</b>浏览器里存的记录解析失败了，先别把它当成空的——
      点下面把原始内容下载下来留底，再决定怎么办。
      <div style="margin-top:10px">
        <a class="btn ghost" style="text-align:center;text-decoration:none;margin:0"
           href="${dlHref(S.loadErrorRaw)}" download="材料承认助手_原始数据_救急.txt">下载原始数据</a>
      </div>
    </div>` : ''}`;
}
function tabs(active){
  const t = [['board','今日看板'],['site','场地视图'],['config','物料配置'],
             ['new','＋ 新建批次'],['io', S.trash && S.trash.length ? '数据 · ' + S.trash.length : '数据']];
  return `<div class="tabs">${t.map(([k,label]) =>
    `<button class="tab ${k===active?'on':''}" data-act="go" data-to="${k}">${label}</button>`).join('')}</div>`;
}

function viewBoard(){
  const bs = S.batches;
  const exc   = bs.filter(b => !b.conclusion && exceptionTag(b));
  const pend  = bs.filter(b => !b.conclusion && needsJudge(b));
  const doing = bs.filter(b => !b.conclusion && !workDone(b));
  const ready = bs.filter(b => !b.conclusion && workDone(b) && !needsJudge(b));
  const done  = bs.filter(b => b.conclusion);

  const order = [...exc, ...pend, ...doing, ...ready, ...done];
  const seen = new Set();
  const list = order.filter(b => !seen.has(b.id) && seen.add(b.id));

  app.innerHTML = `
    ${header('材料承认助手')}
    ${tabs('board')}
    <div class="stats">
      <div class="stat blue"><b>${doing.length}</b><span>进行中</span></div>
      <div class="stat pink"><b>${pend.length}</b><span>待判定</span></div>
      <div class="stat blue"><b>${ready.length}</b><span>待承认</span></div>
      <div class="stat alert"><b>${exc.length}</b><span>异常</span></div>
      <div class="stat pink"><b>${done.length}</b><span>已承认</span></div>
    </div>
    ${list.length ? list.map(cardHTML).join('') : `
      <div class="card" style="text-align:center;padding:34px 18px">
        <div style="font-size:16px;font-weight:600;margin-bottom:6px">还没有批次</div>
        <div class="note" style="margin-bottom:18px">
          收到样品就登记一条，之后每做完一个测试项点一下，
          这里就会告诉你哪些批次卡住了、下一步该做什么、该去哪个场地。
        </div>
        <button class="btn primary" style="max-width:240px;margin:0 auto"
                data-act="go" data-to="new">＋ 登记第一批样品</button>
      </div>`}
    <footer>
      <div class="note">数据只存在这台设备上，不会上传。建议每周到「数据」页导出一次备份。</div>
    </footer>
  `;
}

function cardHTML(b){
  const n = judgedCount(b), w = workedCount(b), total = b.items.length;
  const nxt = nextItem(b);
  const pct = total ? Math.round(w / total * 100) : 0;
  return `<div class="card" data-act="open" data-id="${b.id}" role="button" tabindex="0" style="cursor:pointer">
    <div class="row">
      <div class="grow">
        <div class="row">
          <span class="code">${esc(b.code)}</span>
          <span class="tag n">${catName(b)}</span>
        </div>
        <div class="sub">${esc(b.spec)}${b.spec?' · ':''}${n}/${total} 项已判定</div>
      </div>
      <div style="text-align:right">${tagsHTML(b)}</div>
    </div>
    <div class="bar ${allDone(b)?'done':''}"><i style="width:${pct}%"></i></div>
    ${nxt ? `<div class="next">下一步：${itemName(nxt.id)}</div>`
          : b.conclusion ? `<div class="next">已归档${b.archiveAt ? ' · ' + b.archiveAt : ''}</div>`
          : needsJudge(b) ? `<div class="next">还有 ${pendingCount(b)} 项没下结论</div>`
          : `<div class="next">全部测试已完成，等你判定</div>`}
  </div>`;
}

function viewDetail(id){
  const b = S.batches.find(x => x.id === id);
  if(!b) { S.view='board'; return render(); }

function viewSite(){
  const bySite = {};   // 场地 -> { 测试项 -> [{code,id}] }
  S.batches.filter(b => !b.conclusion).forEach(b => {

      if(i.status !== 'todo' && i.status !== 'doing') return;
      const sites = itemSites(i.id);
      (sites.length ? sites : ['未填场地']).forEach(site => {
        bySite[site] = bySite[site] || {};
        (bySite[site][i.id] = bySite[site][i.id] || []).push({code:b.code, id:b.id});
      });
    });
  });

  const score = st => Object.values(bySite[st]).reduce((a, l) => a + l.length, 0);
  const sites = Object.keys(bySite).sort((a, c) => score(c) - score(a));

  app.innerHTML = `

/* --------------------------------------------------------------- 导入导出 */
const IO_HEAD = ['批次编号','物料品类','变体','物料规格','供应商','采购',
                 '送样日期','送样数量','已完成项数','承认结论'];

function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows){ return rows.map(r => r.map(csvCell).join(',')).join('\r\n'); }
function dlHref(text){
  return 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(text);
}
function templateCSV(){
  return toCSV([IO_HEAD,
    ['A-1001','可熔体（丝材）','','φ0.900mm','S14006','张敏','2026-01-16','0.26Kg',3,'承认'],
    ['A-1002','焊锡','','Φ1.1mm','S13009','李伟','2026-07-21','0.5Kg',2,''],
    ['A-1003','可熔体（银铜带）','纯银带','0.070*32mm','S14063','','2025-09-18','100g',1,'']]);
}
function exportCSV(){
  const out = [IO_HEAD.concat(['送样次数','测试项总数','承认日期'])];
  S.batches.forEach(b => {
    const c = cat(b);
    out.push([b.code, c.name, c.variant || '', b.spec, b.supplier, b.buyer,
              b.recvDate, b.qty, judgedCount(b), b.conclusion,
              b.round, b.items.length, b.archiveAt]);
  });
  return toCSV(out);
}

function parseCSV(text){
  text = String(text).replace(/^\uFEFF/, '');
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += ch;
    }
    else if(ch === '"') q = true;
    else if(ch === ','){ row.push(f); f = ''; }
    else if(ch === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if(ch !== '\r') f += ch;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

function normDate(s){
  const m = String(s || '').trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`
           : String(s || '').trim();
}

function findCat(name, variant){
  let n = String(name || '').trim(), v = String(variant || '').trim();
  if(n.includes('·')){
    const p = n.split('·'); n = p[0].trim();
    if(!v) v = (p[1] || '').trim();
  }
  const exact = CATS.find(c => c.name === n && (c.variant || '') === v);
  if(exact) return {cat:exact};
  const same = CATS.filter(c => c.name === n);
  if(same.length === 1) return {cat:same[0]};
  if(same.length > 1) return {err:`「${n}」有 ${same.length} 个变体，请在「变体」列写清楚`};
  return {err:`认不出品类「${n}」`};
}

function doImport(text){
  const rows = parseCSV(text);
  if(rows.length < 2) return {added:0, problems:['文件里没有数据行']};
  const head = rows[0].map(h => String(h).trim());
  const col = (...names) => {
    for(const nm of names){ const i = head.findIndex(h => h.includes(nm)); if(i >= 0) return i; }
    return -1;
  };
  const C = {
    code: col('批次编号'), name: col('物料品类'), variant: col('变体'),
    spec: col('物料规格','规格'), supplier: col('供应商'), buyer: col('采购'),
    recv: col('送样日期'), qty: col('送样数量'), doneN: col('已完成项数'),
    conc: col('承认结论')
  };
  if(C.code < 0 || C.name < 0) return {added:0, problems:['必须有「批次编号」和「物料品类」两列']};

  const existing = new Set(S.batches.map(b => b.code));
  let added = 0; const problems = [];
  for(let r = 1; r < rows.length; r++){
    const g = k => C[k] >= 0 ? String(rows[r][C[k]] == null ? '' : rows[r][C[k]]).trim() : '';
    const code = g('code');
    if(!code) continue;
    if(existing.has(code)){ problems.push(`第 ${r+1} 行「${code}」：批次号已存在，跳过`); continue; }
    const found = findCat(g('name'), g('variant'));
    if(found.err){ problems.push(`第 ${r+1} 行「${code}」：${found.err}`); continue; }
    const c = found.cat;
    const rd = g('recv') ? normDate(g('recv')) : '';
    const doneN = Math.max(0, Math.min(parseInt(g('doneN'), 10) || 0, c.items.length));
    const conc = g('conc');
    existing.add(code);
    S.batches.push({
      id: S.seq++, code, catId: c.id, spec: g('spec'), supplier: g('supplier'),
      buyer: g('buyer'), recvDate: rd || today(), qty: g('qty'),
      items: c.items.map((iid, i) => ({
        id:iid, status: i < doneN ? 'done' : 'todo', value:'', note:'',
        startDate: i < doneN ? (rd || null) : null,
        doneDate:  i < doneN ? (rd || null) : null
      })),
      round: 1, history: [],
      conclusion: (conc === '承认' || conc === '不承认') ? conc : '',
      archiveAt: '', lastUpdate: today()
    });
    added++;
  }
  S.batches.sort((a, b) => String(b.recvDate).localeCompare(String(a.recvDate)));
  return {added, problems};
}

    </table></div>
    <div class="note" style="margin-top:12px">
      这张表就是小程序里的数据字典。以后要加测试项或改某个物料的必做项，在这里改一次，
      新建的批次就按新规则走，已经建好的批次不受影响——这是当初把它设计成“表”而不是“列”的原因。
    </div>
  `;
}

/* ------------------------------------------------------------------ 事件 */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  handleAction(el);
});

// 键盘也能用：Tab 到卡片 / 测试项，回车或空格等于点击
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest && e.target.closest('[data-act]');
  if(!el || ['BUTTON','A','INPUT','SELECT'].includes(el.tagName)) return;
  e.preventDefault();
  handleAction(el);
});

function handleAction(el){
  const act = el.dataset.act;

  if(act === 'go'){
    S.view = el.dataset.to;
    if(S.view === 'board') S.cur = null;
    return render();
  }
  if(act === 'open'){
    S.cur = Number(el.dataset.id); S.view = 'detail'; return render();
  }
  if(act === 'open-item'){
    S.cur = Number(el.dataset.id);
    S.curItem = el.dataset.item;
    S.view = 'record'; return render();
  }
  if(act === 'edit'){
    S.cur = Number(el.dataset.id);
    S.view = 'edit'; return render();
  }
  if(act === 'save'){
    const b = S.batches.find(x => x.id === S.cur);
    const g = id => document.getElementById(id).value.trim();
    b.code     = g('code') || b.code;
    b.spec     = g('spec');
    b.supplier = g('supplier');
    b.buyer    = g('buyer');
    b.recvDate = document.getElementById('recvDate').value || b.recvDate;
    b.qty      = g('qty');
    touch(b);
    S.view = 'detail'; return render();
  }
  if(act === 'set'){
    const b = S.batches.find(x => x.id === S.cur);
    const it = b.items.find(i => i.id === S.curItem);
    const v = el.dataset.val;
    it.status = v;
    if(v === 'doing' && !it.startDate) it.startDate = today();
    if(v === 'done' || v === 'fail'){
      it.doneDate = today();
      if(!it.startDate) it.startDate = today();
    }
    const vi = document.getElementById('val'); if(vi) it.value = vi.value;
    const ni = document.getElementById('note'); if(ni) it.note = ni.value;
    touch(b);
    S.view = 'detail'; return render();
  }
  if(act === 'saveval'){
    const b = S.batches.find(x => x.id === S.cur);
    const it = b.items.find(i => i.id === S.curItem);
    it.value = document.getElementById('val').value;
    it.note  = document.getElementById('note').value;
    touch(b); save();
    el.textContent = '已保存 ✓';
    setTimeout(() => { el.textContent = '只保存数据，不改状态'; }, 1200);
    return;
  }
  if(act === 'conclude'){
    const b = S.batches.find(x => x.id === S.cur);
    b.conclusion = el.dataset.val;
    if(b.conclusion === '承认') b.archiveAt = today();
    touch(b); return render();
  }
  if(act === 'resubmit'){
    const b = S.batches.find(x => x.id === S.cur);
    if(!confirm(`开始第 ${b.round + 1} 次送样？当前进度会存成历史，测试项全部重置。`)) return;
    b.history = b.history || [];
    b.history.push({
      round: b.round,
      conclusion: b.conclusion,
      date: today(),
      items: b.items.map(i => ({id:i.id, status:i.status, value:i.value, doneDate:i.doneDate}))
    });
    b.round += 1;
    b.items = b.items.map(i => ({id:i.id, status:'todo', value:'', note:'',
                                 startDate:null, doneDate:null}));
    b.conclusion = '';
    b.archiveAt = '';
    b.recvDate = today();
    touch(b);
    return render();
  }
  if(act === 'create'){
    const catId = Number(document.getElementById('cat').value);
    const code = document.getElementById('code').value.trim();
    if(!code){ alert('批次编号不能空'); return; }
    const c = CATS.find(x => x.id === catId) || CATS[0];
    const b = {
      id: S.seq++, code, catId,
      spec: document.getElementById('spec').value.trim(),
      supplier: document.getElementById('supplier').value.trim(),
      buyer: document.getElementById('buyer').value.trim(),
      recvDate: document.getElementById('recvDate').value || today(),
      qty: document.getElementById('qty').value.trim(),
      items: c.items.map(iid => ({id:iid, status:'todo', value:'', startDate:null, doneDate:null})),
      conclusion:'', archiveAt:'', lastUpdate: today()
    };
    S.batches.unshift(b);
    S.cur = b.id; S.view = 'detail';
    return render();
  }
  if(act === 'delete'){
    const b = S.batches.find(x => x.id === S.cur);
    if(!b) return;
    if(!confirm(`把批次「${b.code}」移到回收站？\n之后可以在「数据」页恢复。`)) return;
    S.trash = S.trash || [];
    b.deletedAt = today();
    S.trash.unshift(b);
    S.batches = S.batches.filter(x => x.id !== b.id);
    S.view = 'board'; S.cur = null;
    return render();
  }
  if(act === 'restore'){
    const id = Number(el.dataset.id);
    const i = (S.trash || []).findIndex(x => x.id === id);
    if(i < 0) return;
    const b = S.trash.splice(i, 1)[0];
    delete b.deletedAt;
    S.batches.unshift(b);
    return render();
  }
  if(act === 'purge'){
    const id = Number(el.dataset.id);
    const b = (S.trash || []).find(x => x.id === id);
    if(!b) return;
    if(!confirm(`彻底删除「${b.code}」？这一步不可恢复。`)) return;
    S.trash = S.trash.filter(x => x.id !== id);
    return render();
  }
  if(act === 'empty-trash'){
    const n = (S.trash || []).length;
    if(!n) return;
    if(!confirm(`回收站里 ${n} 个批次将被永久删除，不可恢复。\n确定吗？`)) return;
    S.trash = [];
    return render();
  }
  if(act === 'clear-item'){
    const b = S.batches.find(x => x.id === S.cur);
    const it = b && b.items.find(i => i.id === S.curItem);
    if(!it) return;
    if(!confirm(`把「${itemName(S.curItem)}」的记录清掉，回到未开始？`)) return;
    it.status = 'todo'; it.value = ''; it.note = '';
    it.startDate = null; it.doneDate = null;
    touch(b);
    S.view = 'detail';
    return render();
  }
  if(act === 'wipe'){
    const n = S.batches.length;
    if(!n){ alert('当前没有批次'); return; }
    if(!confirm(`把 ${n} 个批次全部移到回收站？\n可以在「数据」页恢复。`)) return;
    S.trash = S.trash || [];
    S.batches.forEach(b => { b.deletedAt = today(); S.trash.unshift(b); });
    S.batches = [];
    return render();
  }
}

// 断网也能打开（实验室里网络不一定好）
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

render();
</script>
